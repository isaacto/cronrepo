[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
dynamic = ["version"]
name = "cronrepo"
readme = "README.md"
requires-python = ">= 3.9"
dependencies = [
    "calf",
    "cronsim",
]
authors = [
    { name="Isaac To", email="isaac.to@gmail.com" },
]
description = "Maintain a set of cron jobs in your code repository"
license = "MIT"
license-files = ["LICENSE"]
classifiers=[
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Topic :: Software Development :: Libraries",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Operating System :: POSIX :: Linux",
]

[project.scripts]
cronrepo = "cronrepo.__main__:cronrepo_mgr"
cronrepo_run = "cronrepo.__main__:cronrepo_run"

[project.urls]
Homepage = "https://github.com/isaacto/cronrepo"
Repository = "https://github.com/isaacto/cronrepo.git"
Issues = "https://github.com/isaacto/cronrepo/issues"

[tool.hatch.version]
source = "regex"
path = "cronrepo/__init__.py"
